<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChartWatch</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>ChartWatch </h1>
    <span id="status-dot" class="dot"></span><br />
    <span id="status-text"><small><br />Inventions4All - github:TWeb79 - Version 2026-08-01</small></span>
  </header>

  <main>
    <section class="card">
      <h2>Scheduler</h2>
      <div class="scheduler-controls">
        <button id="start-cycle-btn">Start Cycle</button>
        <button id="stop-cycle-btn" class="btn-red">Stop</button>
        <span id="scheduler-status" class="status-idle">Idle</span>
      </div>
    </section>

    <section class="card" id="setup-section">
      <h2>Setup <button id="setup-toggle" class="setup-toggle">▼</button></h2>
      <div id="setup-body">
      <label>Target window
        <select id="window-select"></select>
        <button id="refresh-windows">Refresh</button>
      </label>
      <label>Interval (minutes)
        <input type="number" id="interval-input" min="1" value="5">
        <small id="interval-min-hint"></small>
      </label>
      <label class="toggle">
        <input type="checkbox" id="auto-approve-toggle">
        Auto-approve trades (bypasses manual confirmation)
      </label>
      </div>
    </section>

    <section class="card">
      <h2>Log</h2>
      <div id="log" class="log-area"></div>
    </section>

    <section class="card">
      <h2>Ollama Response</h2>
      <div id="ollama-response" class="ollama-response">
        <div class="ollama-summary">No response yet</div>
      </div>
      <div id="ollama-details" class="ollama-details hidden"></div>
      <div id="ollama-expand-btn" class="ollama-expand-btn hidden">Expand</div>
      <div id="ollama-screenshot-overlay" class="ollama-screenshot-overlay hidden">
        <img id="ollama-screenshot-img" src="" alt="Screenshot" />
        <button id="ollama-screenshot-close" class="ollama-screenshot-close">Close</button>
      </div>
    </section>

    <section class="card">
      <h2>History</h2>
      <table id="history-table">
        <thead>
          <tr>
            <th></th>
            <th>Time</th>
            <th>Trend</th>
            <th>Confidence</th>
            <th>Action</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <div id="approval-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Trade proposal</h2>
      <p id="approval-assessment"></p>
      <pre id="approval-details"></pre>
      <div class="countdown">Auto-deny in <span id="countdown-value">60</span>s</div>
      <div class="modal-actions">
        <button id="deny-btn" class="btn-denied">Deny</button>
        <button id="approve-btn" class="btn-approved">Approve</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
