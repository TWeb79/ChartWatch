<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChartWatch</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>by Inventions4All - github:TWeb79 - Version 2026-07-31</h1>
    <span id="status-dot" class="dot"></span>
  </header>

  <main>
    <section class="card">
      <h2>Scheduler</h2>
      <div class="scheduler-controls">
        <button id="start-cycle-btn">Start Cycle</button>
        <button id="stop-cycle-btn" class="btn-red">Stop</button>
        <span id="scheduler-status" class="status-idle">Idle</span>
      </div>
    </section>

    <section class="card">
      <h2>Setup</h2>
      <label>Target window
        <select id="window-select"></select>
        <button id="refresh-windows">Refresh</button>
      </label>
      <label>Interval (minutes)
        <input type="number" id="interval-input" min="1" value="5">
      </label>
      <label class="toggle">
        <input type="checkbox" id="auto-approve-toggle">
        Auto-approve trades (bypasses manual confirmation)
      </label>
    </section>

    <section class="card">
      <h2>Log</h2>
      <div id="log" class="log-area"></div>
    </section>

    <section class="card">
      <h2>Ollama Response</h2>
      <pre id="ollama-response" class="ollama-response">No response yet</pre>
    </section>

    <section class="card">
      <h2>History</h2>
      <table id="history-table">
        <thead>
          <tr><th>Time</th><th>Trend</th><th>Confidence</th><th>Action</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <div id="approval-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Trade proposal</h2>
      <p id="approval-assessment"></p>
      <pre id="approval-details"></pre>
      <div class="countdown">Auto-deny in <span id="countdown-value">60</span>s</div>
      <div class="modal-actions">
        <button id="deny-btn" class="btn-denied">Deny</button>
        <button id="approve-btn" class="btn-approved">Approve</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
